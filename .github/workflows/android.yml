name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test socket server
        working-directory: socket-server
        run: npm ci && npm test

      - name: Check WordPress plugin PHP syntax
        run: for f in $(find wordpress-plugin -name '*.php'); do php -l "$f"; done

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug -PVERSION_CODE=${{ github.run_number }}

      - name: Decode signing keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease -PVERSION_CODE=${{ github.run_number }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bistbarg-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release builds
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bistbarg-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Prepare download files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/bistbarg.apk
          (cd wordpress-plugin && zip -qr ../dist/bistbarg-push.zip bistbarg-push)
          (cd wordpress-plugin && zip -qr ../dist/bistbarg-otp.zip bistbarg-otp)
          (cd wordpress-plugin && zip -qr ../dist/bistbarg-pricing.zip bistbarg-pricing)
          # Ship the socket server with its one dependency (ws) so the server needs no npm access.
          (cd socket-server && rm -rf node_modules && npm ci --omit=dev --no-audit --no-fund >/dev/null \
            && zip -qr ../dist/bistbarg-socket.zip server.js package.json package-lock.json node_modules \
               install.sh bistbarg-socket.service nginx.conf.example apache.conf.example README.md)
          cp socket-server/install.sh dist/install-socket.sh
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then cp app/build/outputs/apk/release/app-release.apk dist/bistbarg-release.apk; fi
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then cp app/build/outputs/bundle/release/app-release.aab dist/bistbarg-release.aab; fi

      # Every push to main becomes a downloadable release, so the latest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/bistbarg.apk
      - name: Publish GitHub release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download **bistbarg.apk** below and open it on your Android phone
            (allow "Install unknown apps" if asked).

            **bistbarg-push.zip** is the WordPress plugin for sending notifications to the app
            (WordPress admin → Plugins → Add New → Upload Plugin).

            **bistbarg-otp.zip** is the WordPress plugin for phone-number (SMS OTP) login/registration via Kavenegar.

            **bistbarg-pricing.zip** is the WordPress plugin for USD-based product pricing that auto-converts to Toman by the dollar rate.

            **bistbarg-socket.zip** is the real-time socket server to run on the site's server.
            Install it on the server (as root) with:
            `curl -fsSL https://github.com/akoSalman/bistbarg-App/releases/latest/download/install-socket.sh | bash`

            Commit: ${{ github.sha }}
          files: dist/*
